name: Publish frappe image

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and push frappe image
    stratergy:
      matrix:
        service_name: ['frappe']
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Get latest tag
        id: latest-tag
        run: echo "tag=$(git describe --abbrev=0 --tags)" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: print tag
        id: latest-tag
        run: echo "${{ github.repository_owner }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: Docker/${{ matrix.service_name }}/.
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/frappe-manager-${{ matrix.service_name }}:${{ env.latest-tag }}
